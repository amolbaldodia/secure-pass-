<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Checker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bubbles" id="bubbles" aria-hidden="true"></div>
  <main class="card">
    <h1>Password Checker</h1>
    <p class="sub">Type a password and see how strong it is.</p>
    <label for="password">Password</label>
    <div class="input-row">
      <input type="password" id="password" placeholder="Type here..." autocomplete="off">
      <button type="button" id="toggle">Show</button>
    <div class="bar" aria-hidden="true">
      <div class="bar-fill" id="barFill"></div>
    </div>
    <p class="strength" id="strengthText" aria-live="polite">Start typing...</p>
    <ul class="rules" id="rules">
      <li data-rule="length">At least 8 characters</li>
      <li data-rule="lower">One small letter (a-z)</li>
      <li data-rule="upper">One capital letter (A-Z)</li>
      <li data-rule="number">One number (0-9)</li>
      <li data-rule="special">One special character (! @ # $ ...)</li>
    </ul>
  </main>
  <script src="script.js"></script>
</body>
</html>
